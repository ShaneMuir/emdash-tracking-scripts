name: Mirror to Bitbucket

# GitHub is the public source of truth for this repo. This mirrors every
# push (all branches and tags, exactly) to our private Bitbucket org so
# nobody has to keep two remotes up to date by hand.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror full repository to Bitbucket
        env:
          # Username and repo path aren't sensitive — they're repository
          # Variables. Only the app password is a Secret.
          BITBUCKET_USERNAME: ${{ vars.BITBUCKET_USERNAME }}
          BITBUCKET_APP_PASSWORD: ${{ secrets.BITBUCKET_APP_PASSWORD }}
          BITBUCKET_REPO: ${{ vars.BITBUCKET_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${BITBUCKET_USERNAME:-}" ] || [ -z "${BITBUCKET_APP_PASSWORD:-}" ] || [ -z "${BITBUCKET_REPO:-}" ]; then
            echo "::error::Missing BITBUCKET_USERNAME / BITBUCKET_REPO (repository Variables) or BITBUCKET_APP_PASSWORD (repository Secret)."
            exit 1
          fi
          git clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" mirror.git
          cd mirror.git
          # Pass credentials via an HTTP Basic auth header rather than embedding
          # them in the URL — the username here is an email address, and an
          # unescaped @ in a user:pass@host URL breaks URL parsing.
          AUTH=$(printf '%s:%s' "$BITBUCKET_USERNAME" "$BITBUCKET_APP_PASSWORD" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic ${AUTH}" push --mirror "https://bitbucket.org/${BITBUCKET_REPO}.git"
