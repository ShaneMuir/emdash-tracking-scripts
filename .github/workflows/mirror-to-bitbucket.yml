name: Mirror to Bitbucket

# GitHub is the public source of truth for this repo. This mirrors every
# push (all branches and tags, exactly) to our private Bitbucket org so
# nobody has to keep two remotes up to date by hand. Same SSH deploy-key
# pattern as fieldlock-sync-guard-for-acf's mirror workflow.
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BITBUCKET_SSH_KEY }}" > ~/.ssh/bitbucket_mirror
          chmod 600 ~/.ssh/bitbucket_mirror
          ssh-keyscan -t ed25519 bitbucket.org >> ~/.ssh/known_hosts

      - name: Mirror to Bitbucket
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/bitbucket_mirror -o IdentitiesOnly=yes
        run: |
          git clone --mirror "https://github.com/${{ github.repository }}.git" repo-mirror
          cd repo-mirror
          git push --mirror git@bitbucket.org:tribusdigital/emdash-tracking-scripts.git
